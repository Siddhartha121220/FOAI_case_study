[project]
name = "smart-hospital-mas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mesa>=3.0",
    "numpy",
    "pandas",
    "matplotlib",
    "networkx",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
